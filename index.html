<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowDash - Task Dashboard</title>

    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="components.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="responsive.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script type="module" src="generation.js" defer></script>
  </head>
  <body>
    <div id="app" class="dashboard-container">
      <header class="main-header">
        <div class="greeting-area">
          <h1 class="greeting-text">
            <span id="greeting-ment">안녕하세요</span>,
            <span
              id="nickname-display"
              class="editable-nickname"
              tabindex="0"
              contenteditable="true"
              >FlowDash</span
            >님 🖐
          </h1>
          <p id="current-date" class="date-text">2026년 1월 22일</p>
        </div>

        <button id="theme-toggle-btn" class="theme-btn" aria-label="테마 변경">
          <i class="fa-solid fa-moon icon-moon"></i>
          <i class="fa-solid fa-sun icon-sun"></i>
        </button>
      </header>

      <section class="stats-container">
        <div class="stat-card highlight">
          <h2 class="stat-label">전체 업무</h2>
          <p id="total-tasks" class="stat-count">0</p>
        </div>
        <div class="stat-card">
          <h2 class="stat-label">할 일</h2>
          <p id="todo-tasks" class="stat-count">0</p>
        </div>
        <div class="stat-card">
          <h2 class="stat-label">진행 중</h2>
          <p id="doing-tasks" class="stat-count">0</p>
        </div>
        <div class="stat-card">
          <h2 class="stat-label">완료 업무</h2>
          <p id="done-tasks" class="stat-count">0</p>
        </div>
        <div class="stat-card">
          <h2 class="stat-label">완료율</h2>
          <p id="completion-rate" class="stat-count">0%</p>
        </div>
      </section>

      <div class="controls-container">
        <div class="search-wrapper">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input
            type="search"
            id="search-input"
            class="search-bar"
            placeholder="검색어를 입력하세요"
            autocomplete="off"
          />
        </div>

        <div class="sub-controls-line">
          <div class="custom-dropdown" id="dropdown-period">
            <button
              class="dropdown-toggle-btn"
              aria-label="기간 필터 선택"
              data-value="all"
            >
              <span class="selected-label">전체 기간</span>
              <span class="arrow-icon"></span>
            </button>
            <ul class="dropdown-menu-list">
              <li data-value="all">전체 기간</li>
              <li data-value="today">오늘</li>
              <li data-value="week">이번 주</li>
              <li data-value="month">이번 달</li>
            </ul>
          </div>

          <div class="custom-dropdown" id="dropdown-priority">
            <button
              class="dropdown-toggle-btn"
              aria-label="우선순위 필터 선택"
              data-value="all"
            >
              <span class="selected-label">전체 우선순위</span>
              <span class="arrow-icon"></span>
            </button>
            <ul class="dropdown-menu-list">
              <li data-value="all">전체 우선순위</li>
              <li data-value="high">높음</li>
              <li data-value="mid">중간</li>
              <li data-value="low">낮음</li>
            </ul>
          </div>

          <button id="sort-toggle-btn" class="sort-btn" data-sort="desc">
            최신순 📋
          </button>

          <button id="open-modal-btn" class="btn-primary">+ 새 할 일</button>
        </div>
      </div>

      <main class="kanban-board">
        <section class="board-column" id="col-todo">
          <div class="column-header">
            <div class="column-title-set">
              <span class="column-dot dot-todo"></span>
              <h2 class="column-name">할 일</h2>
              <span id="todo-count" class="column-count">0</span>
            </div>
          </div>
          <div class="column-cards-area" id="todo-list">
            <div id="todo-empty" class="empty-state">할 일이 없습니다.</div>
          </div>
        </section>

        <section class="board-column" id="col-doing">
          <div class="column-header">
            <div class="column-title-set">
              <span class="column-dot dot-doing"></span>
              <h2 class="column-name">진행 중</h2>
              <span id="doing-count" class="column-count">0</span>
            </div>
          </div>
          <div class="column-cards-area" id="doing-list"></div>
        </section>

        <section class="board-column" id="col-done">
          <div class="column-header">
            <div class="column-title-set">
              <span class="column-dot dot-done"></span>
              <h2 class="column-name">완료</h2>
              <span id="done-count" class="column-count">0</span>
            </div>
          </div>
          <div class="column-cards-area" id="done-list"></div>
        </section>
      </main>
    </div>

    <div id="todo-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <header class="modal-header">
          <h2 class="modal-title">새 할 일 추가</h2>
        </header>

        <form id="todo-form" class="modal-form" novalidate>
          <div class="form-group">
            <label for="todo-title-input" class="form-label">제목</label>
            <input
              type="text"
              id="todo-title-input"
              class="form-control-input"
              placeholder="제목을 입력하세요 (최대 20자)"
              maxlength="20"
              required
            />
          </div>

          <div class="form-group">
            <label for="todo-content-input" class="form-label">내용</label>
            <textarea
              id="todo-content-input"
              class="form-control-textarea"
              placeholder="내용을 입력하세요 (최대 100자)"
              maxlength="100"
            ></textarea>
          </div>

          <div class="form-group-row">
            <div class="form-group flex-1">
              <label class="form-label">우선순위</label>
              <div class="priority-selector">
                <label class="priority-label-wrapper">
                  <input
                    type="radio"
                    name="priority"
                    value="high"
                    class="radio-hidden"
                  />
                  <span class="priority-badge-btn high">높음</span>
                </label>
                <label class="priority-label-wrapper">
                  <input
                    type="radio"
                    name="priority"
                    value="mid"
                    class="radio-hidden"
                    checked
                  />
                  <span class="priority-badge-btn mid">중간</span>
                </label>
                <label class="priority-label-wrapper">
                  <input
                    type="radio"
                    name="priority"
                    value="low"
                    class="radio-hidden"
                  />
                  <span class="priority-badge-btn low">낮음</span>
                </label>
              </div>
            </div>

            <div class="form-group flex-1">
              <label class="form-label">태그 설정</label>
              <div class="select-wrapper">
                <select
                  id="todo-status-select"
                  name="status"
                  class="select-box modal-select"
                >
                  <option value="todo" selected>할 일</option>
                  <option value="doing">진행 중</option>
                  <option value="done">완료</option>
                </select>
              </div>
            </div> </div> <footer class="form-actions modal-footer-buttons">
            <button
              type="button"
              id="close-modal-btn"
              class="btn-secondary-link"
            >
              취소
            </button>
            <button
              type="submit"
              id="submit-todo-btn"
              class="btn-submit-purple"
            >
              저장하기
            </button>
          </footer>
        </form>
      </div>
    </div>

    <div id="confirm-modal" class="modal-overlay hidden">
      <div class="modal-content confirm-box" role="alertdialog">
        <h2 class="confirm-title" id=\"confirm-title\">삭제 확인</h2>
        <p class=\"confirm-message\" id=\"confirm-message\">
          정말로 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.
        </p>
        <footer class="form-actions">
          <button type="button" id="confirm-cancel-btn" class="btn-secondary">
            취소
          </button>
          <button type="button" id="confirm-action-btn" class="btn-danger">
            삭제하기
          </button>
        </footer>
      </div>
    </div>
  </body>
</html>
