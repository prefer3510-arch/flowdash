<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>메뉴바</title>
    <style>
      nav {
        background: #1e293b;
        padding: 0 1rem;
      }
      .menu {
        list-style: none;
        margin: 0;
        padding: 0;
        /* display: flex; ← 핵심! */
        gap: 0;
      }
      .menu a {
        display: block;
        padding: 0.75rem 1.2rem;
        color: #cbd5e1;
        text-decoration: none;
      }
      .menu a:hover {
        background: #334155;
        color: white;
      }
    </style>
  </head>
  <body>
    <nav>
      <ul class="menu">
        <li><a href="#">홈</a></li>
        <li><a href="#">소개</a></li>
        <li><a href="#">포트폴리오</a></li>
        <li><a href="#">연락처</a></li>
      </ul>
    </nav>
  </body>
</html>
