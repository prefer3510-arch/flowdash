<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>HTML 첫 수업 후기</h1>
    <h2>드디어 태그를 배웠다</h2>
    <time datetime="2026-05-03">2026년 5월 3일</time>
    <p>
      오늘 처음<em>시맨틱 태그</em>의 의미를 알게 됐다. 단순히
      <strong>크기를 키우는게 아니라</strong>
      글자에 의미를 붙이는 거였다.
    </p>

    <p>가장 인상 깊은 한 줄:<mark>제목 태그는 페이지의 목차다.</mark></p>
    <blockquote>의미를 붙이는 것이 디자인보다 먼저다.</blockquote>
    ㅡ<cite>강사 한 마디</cite>
    <p>
      <abbr title="HyperText Markup Language">HTML</abbr>은 우리가 배우는 마크업
      언어!
    </p>
    <p>예시:<code>&it;h1&gt;</code>.저장:<kbd>Ctrl</kbd>+<kbd>S</kbd></p>
  </body>
</html>
